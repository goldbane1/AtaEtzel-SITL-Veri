# =====================================================================
# AtaEtzel — SITL Veri Üretimi Yapılandırması
# ---------------------------------------------------------------------
# Bu dosya, tüm betiklerin ortak ayarlarını tutar. Her kişi KENDİ
# makinesinde yalnızca "pc_id" ve "ucus_no_araligi" alanlarını
# değiştirir; geri kalanı tüm makinelerde AYNI kalmalıdır.
#
# Makine düzeni (uçuş numarası çakışmasını önler; her makinenin kendi pc_id'si vardır):
#   pc1 -> F100-F199   (ucus_no_araligi: [100, 199])   Batuhan masaüstü
#   pc2 -> F200-F299   (ucus_no_araligi: [200, 299])   Şeyma laptop
#   pc3 -> F300-F399   (ucus_no_araligi: [300, 399])   Hasan laptop
#   pc4 -> F400-F499   (ucus_no_araligi: [400, 499])   Yusuf laptop
#   pc5 -> F500-F599   (ucus_no_araligi: [500, 599])   Batuhan laptop
# =====================================================================

# Bu makinenin kimliği. Seçenekler: pc1, pc2, pc3, pc4, pc5.
# Dosya adları ve uçuş numaraları bu değere göre ayrışır.
pc_id: pc1

# Bu makineye ait uçuş numarası aralığı [alt, ust] (her ikisi de dahil).
# pcN için N00-N99 olmalıdır (ör. pc4 için 400-499).
ucus_no_araligi: [100, 199]

# Simülasyonun çalıştığı ana makine. Her şey yerel (localhost) içindir.
host: "127.0.0.1"

# Yer istasyonu/saldırgan betiklerinin yazdığı UDP portu (ortak telsiz kanalı).
udp_port: 14550

# Havadan enjeksiyon portu (yalnızca 127.0.0.1). Sahte telemetri buraya yazılır:
# yer istasyonuna gider, SITL'ye iletilmez.
hava_enjeksiyon_port: 14551

# ArduPlane SITL'nin dinlediği TCP portu (otopilota giden kablo).
tcp_port: 5760

# SITL'nin temel TCP portu (ileride birden çok araç için taban değer).
sitl_port_base: 5760

# Uçuş klasörlerinin yazılacağı kök dizin (repo köküne göre).
veri_klasoru: "veri/ucuslar"

# Ham baytları (raw_hex) parquet'e yaz. replay saldırısı ve etiketleme
# bu alana ihtiyaç duyar. Dosyayı küçültmek için false yapılabilir,
# ancak o zaman replay.py çalışmaz.
raw_hex_kaydet: true

# Kanal bozulması profilleri. Üretim betikleri KANAL_PROFIL ile seçer.
kanal_profilleri:
  temiz: {gecikme_ms: 0, jitter_ms: 0, kayip_yuzde: 0}
  hafif: {gecikme_ms: 20, jitter_ms: 5, kayip_yuzde: 1}
  orta: {gecikme_ms: 80, jitter_ms: 20, kayip_yuzde: 3}
  agir: {gecikme_ms: 200, jitter_ms: 60, kayip_yuzde: 8}
